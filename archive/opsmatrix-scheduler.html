<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpsMatrix Scheduler</title>
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --surface-2: #f7f9fa;
    --ink: #1c2b33;
    --muted: #5b7083;
    --faint: #8fa3b0;
    --line: #d8e0e6;
    --line-soft: #e7edf1;
    --brand: #0f6b62;
    --brand-soft: #e2f0ee;
    --brand-ink: #ffffff;
    --accent: #d98e1f;
    --accent-soft: #fbf1de;
    --ok: #2e8f63;
    --ok-soft: #e2f2ea;
    --warn: #c07f16;
    --warn-soft: #faeed7;
    --danger: #c34444;
    --danger-soft: #f9e7e7;
    --mono: Consolas, "Cascadia Code", "SF Mono", monospace;
    --sans: "Segoe UI", -apple-system, Roboto, "Helvetica Neue", sans-serif;
    --shadow: 0 1px 3px rgba(28,43,51,.08), 0 4px 14px rgba(28,43,51,.06);
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.45;
  }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; font-size: 13px; color: var(--ink); }
  ::selection { background: var(--brand-soft); }

  /* ---------- header ---------- */
  header.app {
    background: var(--surface); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 18px; padding: 0 18px;
    height: 54px; position: sticky; top: 0; z-index: 40;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .brand .logo { font-weight: 700; font-size: 15px; letter-spacing: .04em; color: var(--brand); }
  .brand .logo b { color: var(--ink); font-weight: 700; }
  .brand .tag { font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: .08em; text-transform: uppercase; }
  nav.tabs { display: flex; gap: 2px; height: 100%; }
  nav.tabs button {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 0 14px; font-size: 13.5px; color: var(--muted); cursor: pointer; height: 100%;
  }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
  nav.tabs button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .kpis { margin-left: auto; display: flex; gap: 16px; }
  .kpi { text-align: right; line-height: 1.15; }
  .kpi .v { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--ink); }
  .kpi .l { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }

  /* ---------- shell layout ---------- */
  .shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 54px); }
  aside.treepane {
    background: var(--surface); border-right: 1px solid var(--line);
    padding: 12px 10px 40px; overflow-y: auto; max-height: calc(100vh - 54px); position: sticky; top: 54px;
  }
  main.content { padding: 18px 20px 60px; min-width: 0; }
  @media (max-width: 980px) {
    .shell { grid-template-columns: 1fr; }
    aside.treepane { position: fixed; left: 0; top: 54px; bottom: 0; width: 300px; z-index: 45;
      transform: translateX(-102%); transition: transform .18s ease; box-shadow: var(--shadow); max-height: none; }
    aside.treepane.open { transform: translateX(0); }
    .treetoggle { display: inline-flex !important; }
  }
  .treetoggle { display: none; background: none; border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 10px; cursor: pointer; color: var(--muted); align-items: center; }

  /* ---------- tree ---------- */
  .scopebar { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; }
  .scopebar .title { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  .scopebar button.clear { margin-left: auto; background: none; border: none; color: var(--brand); font-size: 12px; cursor: pointer; }
  .tnode { user-select: none; }
  .trow {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 7px; cursor: pointer;
    border: 1px solid transparent;
  }
  .trow:hover { background: var(--surface-2); }
  .trow.selected { background: var(--brand-soft); border-color: rgba(15,107,98,.25); }
  .trow .caret { width: 14px; text-align: center; color: var(--faint); font-size: 10px; flex: none; cursor: pointer; }
  .trow .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .trow.lvl-building .nm { font-weight: 700; }
  .trow.lvl-floor .nm { font-weight: 600; }
  .trow.lvl-dept .nm { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  .trow.lvl-room .nm { font-weight: 400; }
  .trow .stat { font-family: var(--mono); font-size: 10.5px; color: var(--faint); flex: none; }
  .trow .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.s-full { background: var(--ok); }
  .dot.s-partial { background: var(--accent); }
  .dot.s-none { background: #c9d4db; }
  .tkids { margin-left: 14px; border-left: 1px solid var(--line-soft); padding-left: 4px; }
  .tree-roll { padding: 10px 8px; margin-top: 10px; border-top: 1px solid var(--line-soft); }
  .tree-roll .rrow { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 2px 0; }
  .tree-roll .rrow b { font-family: var(--mono); font-weight: 600; color: var(--ink); }
  .tree-empty { padding: 18px 10px; color: var(--faint); font-size: 13px; }

  /* ---------- generic cards / panels ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card + .card { margin-top: 16px; }
  .card > .chead {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-soft);
  }
  .card > .chead h2 { font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  .card > .chead .sub { font-size: 12px; color: var(--faint); }
  .card > .cbody { padding: 14px 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spacer { flex: 1 1 auto; }
  h1.pagetitle { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  p.pagesub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px;
    cursor: pointer; transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--surface-2); border-color: #c3cfd7; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .btn.primary:hover { background: #0c5951; }
  .btn.danger { color: var(--danger); border-color: #e3b6b6; }
  .btn.danger:hover { background: var(--danger-soft); }
  .btn.small { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
  .btn.ghost { border-color: transparent; background: none; color: var(--brand); }
  .btn.ghost:hover { background: var(--brand-soft); }
  .btn[disabled] { opacity: .45; cursor: default; pointer-events: none; }

  /* ---------- inputs ---------- */
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--surface);
  }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { border-color: var(--brand); outline: none; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.grid th {
    text-align: left; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
    padding: 8px 10px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2);
  }
  table.grid td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  table.grid tr:hover td { background: #fbfcfd; }
  table.grid td.num, table.grid th.num { text-align: right; font-family: var(--mono); }
  table.grid td input, table.grid td select {
    padding: 4px 7px; border-radius: 5px; font-size: 12.5px; width: 100%;
  }
  table.grid td input[type=number] { width: 74px; text-align: right; font-family: var(--mono); }
  .tablewrap { overflow-x: auto; }

  /* ---------- intake ---------- */
  .dropzone {
    border: 2px dashed var(--line); border-radius: var(--radius); padding: 42px 20px; text-align: center;
    background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.hover { border-color: var(--brand); background: var(--brand-soft); }
  .dropzone .big { font-size: 15px; font-weight: 600; }
  .dropzone .hint { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .dropzone .hint code { font-family: var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .pairlist { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .pairitem {
    display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 12px;
  }
  .pairitem .fname { font-family: var(--mono); font-size: 12px; }
  .pairitem .st { margin-left: auto; font-size: 12px; }
  .pairitem .st.ok { color: var(--ok); }
  .pairitem .st.wait { color: var(--faint); }
  .badge {
    display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 2px 8px; border-radius: 99px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
  }
  .badge.ok { background: var(--ok-soft); border-color: rgba(46,143,99,.35); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); border-color: rgba(192,127,22,.35); color: var(--warn); }
  .badge.brand { background: var(--brand-soft); border-color: rgba(15,107,98,.3); color: var(--brand); }

  /* ---------- board ---------- */
  .boardgrid { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1180px) { .boardgrid { grid-template-columns: 1fr; } }
  .tray { position: sticky; top: 70px; }
  .tray .cbody { max-height: calc(100vh - 210px); overflow-y: auto; }
  .chip {
    display: flex; align-items: center; gap: 7px; padding: 6px 9px; border: 1px solid var(--line);
    border-radius: 7px; background: var(--surface); margin-bottom: 6px; cursor: grab; font-size: 12.5px;
  }
  .chip:active { cursor: grabbing; }
  .chip.dragging { opacity: .4; }
  .chip .mins { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .chip .rt { font-size: 10.5px; color: var(--faint); }
  .chip.job { border-left: 3px solid var(--accent); }
  .chip.room { border-left: 3px solid var(--brand); }
  .shiftblock { margin-bottom: 20px; }
  .shifthead {
    display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px 8px 0 0; border-bottom: none;
  }
  .shifthead h3 { font-size: 13px; font-weight: 700; }
  .shifthead .time { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .shifthead .tot { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .empgrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px;
    padding: 12px; border: 1px solid var(--line); border-radius: 0 0 8px 8px; background: var(--surface);
  }
  .empcard { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; min-height: 120px; }
  .empcard.dropover { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
  .empcard .ehead { padding: 9px 11px 6px; }
  .empcard .ehead .nm { font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: baseline; }
  .empcard .ehead .role { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
  .capbar { height: 6px; border-radius: 4px; background: var(--line-soft); margin: 5px 11px 4px; overflow: hidden; position: relative; }
  .capbar > i { display: block; height: 100%; border-radius: 4px; background: var(--ok); transition: width .15s; }
  .capbar.warn > i { background: var(--warn); }
  .capbar.over > i { background: var(--danger); }
  .capnote { font-family: var(--mono); font-size: 10.5px; color: var(--muted); padding: 0 11px 6px; }
  .empcard .list { padding: 4px 8px 10px; flex: 1; }
  .shiftdrop { border: 1px dashed var(--line); border-radius: 7px; padding: 8px 10px; font-size: 12px; color: var(--faint); margin-top: 8px; }
  .shiftdrop.dropover { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  .areagroup { padding: 8px 0; }
  .areagroup h4 { font-size: 12.5px; margin-bottom: 6px; }
  .cover { font-size: 12px; color: var(--muted); }

  /* ---------- map ---------- */
  .filterbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
  .filterbar .field { min-width: 130px; }
  .maplegend { display: flex; gap: 12px; flex-wrap: wrap; padding: 10px 4px 0; font-size: 12px; color: var(--muted); }
  .maplegend .li { display: inline-flex; align-items: center; gap: 6px; }
  .maplegend .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  canvas.floorcv { display: block; width: 100%; border-radius: 0 0 var(--radius) var(--radius);
    background:
      repeating-linear-gradient(0deg, transparent 0 23px, rgba(15,107,98,.04) 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, rgba(15,107,98,.04) 23px 24px),
      #fbfcfd;
    cursor: crosshair;
  }
  .nolabel { padding: 8px 16px 14px; font-size: 12px; color: var(--muted); }
  .nolabel .chiplink { display: inline-block; margin: 2px 4px 2px 0; padding: 3px 9px; border: 1px solid var(--line);
    border-radius: 99px; cursor: pointer; background: var(--surface); font-size: 12px; }
  .nolabel .chiplink:hover { border-color: var(--brand); color: var(--brand); }

  /* ---------- detail drawer ---------- */
  .drawer {
    position: fixed; top: 54px; right: 0; bottom: 0; width: 380px; max-width: 94vw; z-index: 50;
    background: var(--surface); border-left: 1px solid var(--line); box-shadow: -6px 0 24px rgba(28,43,51,.12);
    transform: translateX(103%); transition: transform .18s ease; display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer .dhead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
  .drawer .dhead h3 { font-size: 15px; font-weight: 700; flex: 1; }
  .drawer .dbody { padding: 14px 16px 30px; overflow-y: auto; flex: 1; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; font-size: 13px; margin-bottom: 14px; }
  .kv .k { color: var(--faint); font-size: 12px; padding-top: 2px; }
  .kv .v { font-weight: 500; }
  .kv .v.mono { font-family: var(--mono); }
  .closex { background: none; border: none; font-size: 17px; color: var(--faint); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .closex:hover { background: var(--surface-2); color: var(--ink); }

  /* ---------- modal ---------- */
  .modalback {
    position: fixed; inset: 0; background: rgba(20,32,40,.45); z-index: 90; display: flex;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal { background: var(--surface); border-radius: 12px; box-shadow: 0 18px 60px rgba(0,0,0,.25);
    width: 560px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column; }
  .modal .mhead { padding: 16px 20px 10px; }
  .modal .mhead h3 { font-size: 15px; }
  .modal .mbody { padding: 6px 20px 12px; overflow-y: auto; }
  .modal .mfoot { padding: 12px 20px 16px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line-soft); }

  /* ---------- toast ---------- */
  #toasthost { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    background: #223640; color: #eef4f7; font-size: 13px; padding: 9px 16px; border-radius: 8px;
    box-shadow: var(--shadow); animation: toastin .18s ease;
  }
  .toast.err { background: var(--danger); }
  @keyframes toastin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .emptystate { padding: 34px 18px; text-align: center; color: var(--muted); }
  .emptystate .big { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .emptystate p { font-size: 13px; max-width: 420px; margin: 0 auto 12px; }

  .note { font-size: 12px; color: var(--muted); }
  .note.estimate { background: var(--accent-soft); border: 1px solid rgba(217,142,31,.3); border-radius: 7px; padding: 8px 12px; }

  /* ---------- print ---------- */
  #printsheet { display: none; }
  @media print {
    body > *:not(#printsheet) { display: none !important; }
    body { background: #fff; }
    #printsheet { display: block; padding: 0; font-size: 12px; }
    .psheet { page-break-after: always; padding: 24px 10px; }
    .psheet h2 { font-size: 16px; margin-bottom: 2px; }
    .psheet .meta { color: #444; margin-bottom: 12px; font-size: 11.5px; }
    .psheet table { width: 100%; border-collapse: collapse; }
    .psheet th, .psheet td { border: 1px solid #bbb; padding: 5px 8px; text-align: left; font-size: 11.5px; }
    .psheet th { background: #f0f0f0; }
    .psheet td.num { text-align: right; font-family: var(--mono); }
    .psheet .sig { margin-top: 26px; display: flex; gap: 40px; }
    .psheet .sig span { border-top: 1px solid #888; padding-top: 4px; width: 220px; font-size: 11px; color: #555; }
  }
</style>
</head>
<body>
<header class="app">
  <button class="treetoggle" id="btnTreeToggle" title="Toggle facility tree" aria-label="Toggle facility tree">&#9776;</button>
  <div class="brand"><span class="logo">OPS<b>MATRIX</b></span><span class="tag">Scheduler</span></div>
  <nav class="tabs" id="mainTabs">
    <button data-view="schedule">Schedule</button>
    <button data-view="map">Map</button>
    <button data-view="import">Import</button>
    <button data-view="settings">Settings</button>
  </nav>
  <div class="kpis" id="kpis"></div>
</header>

<div class="shell">
  <aside class="treepane" id="treePane">
    <div class="scopebar">
      <span class="title">Facility</span>
      <button class="clear" id="btnClearScope" style="display:none">clear scope</button>
    </div>
    <div id="treeHost"></div>
    <div class="tree-roll" id="treeRollup"></div>
  </aside>
  <main class="content" id="content"></main>
</div>

<div class="drawer" id="drawer">
  <div class="dhead">
    <h3 id="drawerTitle">Room</h3>
    <button class="closex" id="btnDrawerClose" aria-label="Close detail">&#10005;</button>
  </div>
  <div class="dbody" id="drawerBody"></div>
</div>

<div id="modalHost"></div>
<div id="toasthost"></div>
<div id="printsheet"></div>

<script>
(function () {
"use strict";

/* ================================================================
   utils
================================================================ */
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function el(tag, attrs, children) {
  var n = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "html") n.innerHTML = v;
      else if (k === "dataset") { for (var dk in v) { if (Object.prototype.hasOwnProperty.call(v, dk)) n.setAttribute("data-" + dk, v[dk]); } }
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
  }
  if (children) {
    for (var i = 0; i < children.length; i++) {
      var c = children[i];
      if (c === null || c === undefined) continue;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
  }
  return n;
}
function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function fmt(n, dp) {
  if (n === null || n === undefined || isNaN(n)) return "–";
  var d = (dp === undefined) ? 0 : dp;
  return Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtHrs(mins) {
  if (!mins) return "0 h";
  return (mins / 60).toFixed(1) + " h";
}
function esc(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function toast(msg, isErr) {
  var host = $("#toasthost");
  var t = el("div", { class: "toast" + (isErr ? " err" : ""), text: msg });
  host.appendChild(t);

/* ================================================================
   parsers — lifted VERBATIM from opsmatrix-scan-importer.html
   (verified against magicplan exports; do not modify)
================================================================ */
function decodeDxfText(s) {
  return s.replace(/\\U\+([0-9a-fA-F]{4})/g, function (m, hex) {
    return String.fromCharCode(parseInt(hex, 16));
  });
}
function parseDXF(text) {
  var lines = text.split(/\r?\n/);
  var walls = [], labels = [], openings = [];
  var section = "", cur = null, i = 0;
  function flush() {
    if (!cur) return;
    if (section !== "ENTITIES") { cur = null; return; }
    if (cur.type === "LWPOLYLINE" && cur.layer === "walls" && cur.pts.length > 2) {
      walls.push({ points: cur.pts, closed: cur.closed });
    } else if (cur.type === "TEXT" && cur.text) {
      labels.push({ text: decodeDxfText(cur.text), x: cur.x, y: cur.y });
    } else if (cur.type === "INSERT" && cur.name && cur.name.indexOf("W-") === 0) {
      openings.push({ name: cur.name, x: cur.x, y: cur.y });
    }
    cur = null;
  }
  while (i < lines.length - 1) {
    var code = parseInt(lines[i].trim(), 10);
    var v = lines[i + 1].trim();
    i += 2;
    if (isNaN(code)) continue;
    if (code === 0) {
      flush();
      if (v === "ENDSEC") section = "";
      if (v === "LWPOLYLINE" || v === "TEXT" || v === "INSERT") {
        cur = { type: v, layer: "", pts: [], closed: false, text: "", name: "", x: 0, y: 0, lastX: null };
      }
      continue;
    }
    if (code === 2 && section === "" && (v === "ENTITIES" || v === "BLOCKS" || v === "HEADER" || v === "TABLES" || v === "OBJECTS")) {
      section = v; continue;
    }
    if (!cur) continue;
    if (code === 8) cur.layer = v;
    else if (code === 70 && cur.type === "LWPOLYLINE") cur.closed = (parseInt(v, 10) & 1) === 1;
    else if (code === 10) {
      if (cur.type === "LWPOLYLINE") cur.lastX = parseFloat(v);
      else cur.x = parseFloat(v);
    }
    else if (code === 20) {
      if (cur.type === "LWPOLYLINE" && cur.lastX !== null) { cur.pts.push([cur.lastX, parseFloat(v)]); cur.lastX = null; }
      else cur.y = parseFloat(v);
    }
    else if (code === 1 && cur.type === "TEXT") cur.text = v;
    else if (code === 2 && cur.type === "INSERT") cur.name = v;
  }
  flush();
  return { walls: walls, labels: labels, openings: openings, units: "ft" };
}
function parseStatsCSV(text) {
  var lines = text.split(/\r?\n/);
  var plan = {}, floors = [], mode = "", currentFloor = null;
  for (var i = 0; i < lines.length; i++) {
    var raw = lines[i];
    if (!raw || !raw.trim()) continue;
    var cells = raw.split(",");
    var first = cells[0].trim();
    if (first === "PLAN ATTRIBUTES") { mode = "plan"; continue; }
    if (first === "FLOOR ATTRIBUTES") { mode = "floorattr"; continue; }
    if (first === "ROOM ATTRIBUTES") { mode = "rooms"; continue; }
    if (first === "WALL ATTRIBUTES" || first === "OBJECT COUNT" || first === "Object Attributes") { mode = first; continue; }
    if (mode === "plan") {
      if (cells.length >= 2 && cells[1].trim()) plan[first] = cells[1].trim();
      continue;
    }
    if (mode === "rooms") {
      var hasData = cells.length > 2 && cells[1] && cells[1].trim() !== "";
      if (!hasData) { currentFloor = { name: first, rooms: [] }; floors.push(currentFloor); }
      else if (currentFloor) {
        currentFloor.rooms.push({
          name: first,
          areaSqFt: parseFloat(cells[1]),
          volumeCuFt: parseFloat(cells[2]),
          groundPerimeter: cells[3] ? cells[3].trim() : "",
          doorAreaSqFt: cells[7] ? parseFloat(cells[7]) : 0,
          windowAreaSqFt: cells[8] ? parseFloat(cells[8]) : 0,
          ceilingHeight: cells[9] ? cells[9].trim() : ""
        });
      }
      continue;
    }
  }
  var gross = plan["Ground surface with all walls: sq ft"];
  var cleanable = plan["Ground surface without walls: sq ft"];
  return {
    grossSqFt: gross ? parseFloat(gross) : null,
    cleanableSqFt: cleanable ? parseFloat(cleanable) : null,
    totalAreaSqFt: cleanable ? parseFloat(cleanable) : null, // cleanable is the working number
    roomCount: plan["Rooms"] ? parseInt(plan["Rooms"], 10) : null,
    created: plan["Project creation date"] || "",
    floors: floors
  };
}

/* ================================================================
   compute — the workload math engine
   cleanableSqFt is the ONLY area used in workload math (gross = reference)
================================================================ */
function findBaseRate(roomType, floorType) {
  var rows = state.rates.baseRates, i, r;
  for (i = 0; i < rows.length; i++) {
    r = rows[i];
    if (r.roomType === roomType && r.floorType === floorType) return r.minutesPer1000;
  }
  for (i = 0; i < rows.length; i++) {
    r = rows[i];
    if (r.roomType === roomType && r.floorType === "(any)") return r.minutesPer1000;
  }
  for (i = 0; i < rows.length; i++) {
    r = rows[i];
    if (r.roomType === "(any)") return r.minutesPer1000;
  }
  return 25;
}
function freqPerWeek(freqId) {
  var f = byId(state.frequencies, freqId);
  return f ? f.perWeek : 7;
}
function roomMinutesPerVisit(room) {
  var base = (room.cleanableSqFt / 1000) * findBaseRate(room.roomType, room.floorType);
  var fix = (room.fixtures || 0) * state.rates.fixtureMinutes;
  return base + fix;
}
function roomDailyMinutes(room) {
  // daily-equivalent minutes: per-visit minutes spread over the week by frequency
  return roomMinutesPerVisit(room) * freqPerWeek(room.frequency) / 7;
}
function jobDailyMinutes(job) {
  if (job.mode === "unit") return (job.unitsPerDay || 0) * (job.minutesPerUnit || 0);
  return job.minutes || 0;
}
function roomStatus(room) {
  if (room.employeeId) return "scheduled";
  if (room.shiftId) return "partial";
  return "unscheduled";
}
function employeeAssignedMinutes(empId) {
  var total = 0, i;
  for (i = 0; i < state.rooms.length; i++) {
    if (state.rooms[i].employeeId === empId) total += roomDailyMinutes(state.rooms[i]);
  }
  for (i = 0; i < state.jobs.length; i++) {
    if (state.jobs[i].employeeId === empId) total += jobDailyMinutes(state.jobs[i]);
  }
  return total;
}
function scopedRooms() {
  // rooms visible under the current tree scope
  var sc = state.ui.scope;
  if (!sc) return state.rooms.slice();
  return state.rooms.filter(function (r) {
    var fl = byId(state.floors, r.floorId);
    if (!fl) return false;
    if (sc.type === "building") return fl.buildingId === sc.buildingId;
    if (sc.type === "floor") return r.floorId === sc.floorId;
    if (sc.type === "dept") return r.floorId === sc.floorId && (r.department || "Unassigned") === sc.dept;
    if (sc.type === "room") return r.id === sc.roomId;
    return true;
  });
}
function rollup(rooms) {
  var out = { rooms: rooms.length, sqft: 0, dailyMin: 0, unscheduled: 0, scheduled: 0, partial: 0 };
  for (var i = 0; i < rooms.length; i++) {
    var r = rooms[i];
    out.sqft += r.cleanableSqFt || 0;
    out.dailyMin += roomDailyMinutes(r);
    var st = roomStatus(r);
    if (st === "scheduled") out.scheduled++;
    else if (st === "partial") out.partial++;
    else out.unscheduled++;
  }
  return out;
}
function facilityFTE() {
  var total = 0, i;
  for (i = 0; i < state.rooms.length; i++) total += roomDailyMinutes(state.rooms[i]);
  for (i = 0; i < state.jobs.length; i++) total += jobDailyMinutes(state.jobs[i]);
  return total / Math.max(1, state.rates.productiveMinutes);
}

/* ================================================================
   intake — import magicplan DXF + CSV pairs
================================================================ */
var intake = { pairs: [], review: null };
// pairs: [{key, dxfName, csvName, dxf, stats}]  review: {rows:[...], totals}

function intakePairKey(fileName) {
  // group by base name minus extension-ish suffixes so "X.dxf" and "X_statistics.csv" pair loosely;
  // fall back to a single open pair (most magicplan exports come as one floor at a time)
  return fileName.toLowerCase().replace(/\.(dxf|csv)$/i, "").replace(/[_\s-]*statistics.*$/i, "").replace(/[_\s-]+$/, "");
}
function intakeHandleFiles(files) {
  var i;
  for (i = 0; i < files.length; i++) {
    (function (file) {
      var name = file.name;
      var lower = name.toLowerCase();
      if (lower.indexOf(".dxf") === -1 && lower.indexOf(".csv") === -1) {
        toast("Skipped " + name + " — need .dxf or .csv", true);
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        var text = reader.result;
        var key = intakePairKey(name);
        var pair = null, j;
        for (j = 0; j < intake.pairs.length; j++) {
          if (intake.pairs[j].key === key) { pair = intake.pairs[j]; break; }

  rows.forEach(function (row) {
    var k = row.building + "␀" + row.floor;
    if (seen[k]) return;
    seen[k] = true;
    var b = findBuildingByName(row.building);
    if (b) {
      var fl = findFloorByName(b.id, row.floor);
      if (fl) conflicts.push({ building: row.building, floor: row.floor, floorId: fl.id });
    }

  if (conflicts.length) {
    var names = conflicts.map(function (c) { return c.building + " / " + c.floor; }).join(", ");

      { label: "Merge (add)", onClick: function () { doMerge(rows, conflicts, "merge"); closeModal(); } },

  }

function filteredRooms(floorId) {
  var f = state.ui.filters;
  return state.rooms.filter(function (r) {
    if (r.floorId !== floorId) return false;
    if (f.shift && r.shiftId !== f.shift) return false;
    if (f.dept && deptKey(r) !== f.dept) return false;
    if (f.rtype && r.roomType !== f.rtype) return false;
    if (f.status && roomStatus(r) !== f.status) return false;

function colorKeyForRoom(r) {
  var cb = state.ui.colorBy;
  if (cb === "dept" || cb === "department") return deptKey(r);
  if (cb === "rtype") return r.roomType;
  if (cb === "status") return roomStatus(r);
  if (cb === "shift") { var s = byId(state.shifts, r.shiftId); return s ? s.name : "no shift"; }
  if (cb === "emp") { var e2 = byId(state.employees, r.employeeId); return e2 ? e2.name : "unassigned"; }
  if (cb === "freq") { var fq = byId(state.frequencies, r.frequency); return fq ? fq.label : "?"; }

}
function drawFloor(cv, floor, legendHost) {
  // rendering approach carried over from the importer: fit-to-extent, Y-flip, scale bar
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth, h = 560;
  cv.width = w * dpr; cv.height = h * dpr;
  var ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  var g = floor.geometry;
  if (!g || !g.walls.length) return;

  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  g.walls.forEach(function (wall) {
    wall.points.forEach(function (p) {
      if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
    });
  });
  var pad = 46;
  var scale = Math.min((w - pad * 2) / (maxX - minX), (h - pad * 2) / (maxY - minY));
  function tx(x) { return pad + (x - minX) * scale; }
  function ty(y) { return h - pad - (y - minY) * scale; } // flip Y

  // walls
  ctx.fillStyle = "rgba(28,43,51,0.82)";
  ctx.strokeStyle = "#3a4d58"; ctx.lineWidth = 1;
  g.walls.forEach(function (wall) {
    ctx.beginPath();
    wall.points.forEach(function (p, idx) {
      if (idx === 0) ctx.moveTo(tx(p[0]), ty(p[1])); else ctx.lineTo(tx(p[0]), ty(p[1]));
    });
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });
  // openings
  ctx.fillStyle = "#d98e1f";
  (g.openings || []).forEach(function (o) {
    ctx.beginPath(); ctx.arc(tx(o.x), ty(o.y), 3, 0, Math.PI * 2); ctx.fill();
  });

  // room markers at label positions, colored by colorBy, dimmed if filtered out
  var visRooms = filteredRooms(floor.id);
  var visIds = {};
  visRooms.forEach(function (r) { visIds[r.id] = true; });
  var colorMap = {}, colorIdx = 0;
  mapMarkers = [];
  state.rooms.filter(function (r) { return r.floorId === floor.id; }).forEach(function (r) {
    if (r.mapX === null || r.mapX === undefined) return;
    var visible = visIds[r.id] === true;
    var key = colorKeyForRoom(r);
    if (visible && !Object.prototype.hasOwnProperty.call(colorMap, key)) {
      colorMap[key] = MAP_COLORS[colorIdx % MAP_COLORS.length];
      colorIdx++;
    }
    var mx = tx(r.mapX), my = ty(r.mapY);
    var rad = 11;
    ctx.beginPath();
    ctx.arc(mx, my, rad, 0, Math.PI * 2);
    ctx.fillStyle = visible ? colorMap[key] : "rgba(150,163,176,0.35)";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();
    ctx.fillStyle = visible ? "#ffffff" : "rgba(255,255,255,0.7)";
    ctx.font = "700 9px " + "Segoe UI, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    var initials = r.name.split(/\s+/).map(function (wd) { return wd.charAt(0); }).join("").slice(0, 2).toUpperCase();
    ctx.fillText(initials, mx, my);
    if (visible) mapMarkers.push({ x: mx, y: my, r: rad + 2, roomId: r.id });
    // name under marker
    ctx.fillStyle = visible ? "#1c2b33" : "rgba(91,112,131,0.5)";
    ctx.font = "600 10.5px Segoe UI, sans-serif";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(r.name, mx, my + rad + 12);
  });

  // scale bar (10 ft)
  var bar = 10 * scale;
  ctx.strokeStyle = "#5b7083"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, h - 16); ctx.lineTo(pad + bar, h - 16); ctx.stroke();
  ctx.fillStyle = "#5b7083"; ctx.font = "10px " + "Consolas, monospace"; ctx.textAlign = "left";
  ctx.fillText("10 ft", pad + bar + 6, h - 13);

  // legend
  if (legendHost) {
    legendHost.innerHTML = "";
    Object.keys(colorMap).forEach(function (k) {
      legendHost.appendChild(el("span", { class: "li" }, [
        el("span", { class: "sw", style: "background:" + colorMap[k] }),
        el("span", { text: k })
      ]));
    });
    if (!Object.keys(colorMap).length) legendHost.appendChild(el("span", { text: "No rooms match the current filters." }));
  }
}

  var pattern = emp ? emp.pattern.slice() : [false, true, true, true, true, true, false];
  var patRow = el("div", { class: "row" });
  days.forEach(function (d, i) {
    var cb = el("input", { type: "checkbox", id: "pat" + i });
    cb.checked = pattern[i];
    cb.addEventListener("change", function () { pattern[i] = cb.checked; });
    patRow.appendChild(el("label", { style: "display:inline-flex;align-items:center;gap:4px;font-size:12px" }, [cb, d]));
  });
  var body = [
    el("div", { class: "field", style: "margin-bottom:10px" }, [el("label", { text: "Name" }), nameInp]),
    el("div", { class: "field", style: "margin-bottom:10px" }, [el("label", { text: "Role" }), roleInp]),
    el("div", { class: "field", style: "margin-bottom:10px" }, [el("label", { text: "Shift" }), selSh]),
    el("div", { class: "field" }, [el("label", { text: "Weekly pattern" }), patRow])
  ];
  var buttons = [
    { label: emp ? "Save" : "Add employee", primary: true, onClick: function () {
      if (!nameInp.value.trim()) { toast("Name is required", true); return; }
      if (emp) {
        emp.name = nameInp.value.trim(); emp.role = roleInp.value.trim(); emp.shiftId = selSh.value; emp.pattern = pattern;
      } else {
        state.employees.push({ id: uid("emp"), name: nameInp.value.trim(), role: roleInp.value.trim() || "EVS Tech", shiftId: selSh.value, pattern: pattern });
      }
      save(); closeModal(); renderAll();
    } },
    { label: "Cancel", onClick: closeModal }
  ];
  if (emp) {
    buttons.splice(1, 0, { label: "Remove", danger: true, onClick: function () {
      state.rooms.forEach(function (r) { if (r.employeeId === emp.id) r.employeeId = null; });
      state.jobs.forEach(function (j) { if (j.employeeId === emp.id) j.employeeId = null; });
      state.employees = state.employees.filter(function (x) { return x.id !== emp.id; });
      save(); closeModal(); renderAll(); toast("Employee removed — their rooms moved to unscheduled");
    } });
  }
  openModal(emp ? "Edit employee" : "New employee", body, buttons);
}
function openJobModal(jobId) {
  var job = jobId ? byId(state.jobs, jobId) : null;
  var nameInp = el("input", { type: "text", value: job ? job.name : "", placeholder: "e.g. Discharge cleans — 4 West" });
  var selType = el("select");
  [["discharge", "Discharge / bed cleans"], ["porter", "Porter / patient transport"], ["trashlinen", "Trash & linen run"], ["laundry", "Laundry"], ["floortech", "Floor tech / project work"], ["custom", "Custom"]].forEach(function (t) {
    var o = el("option", { value: t[0], text: t[1] });
    if (job && job.type === t[0]) o.selected = true;
    selType.appendChild(o);
  });
  var selMode = el("select");
  [["unit", "Unit-based (count / day × minutes each)"], ["block", "Time block (fixed minutes / day)"]].forEach(function (m2) {
    var o = el("option", { value: m2[0], text: m2[1] });
    if (job && job.mode === m2[0]) o.selected = true;
    selMode.appendChild(o);
  });
  var unitsInp = el("input", { type: "number", min: "0", step: "1", value: String(job && job.unitsPerDay !== undefined ? job.unitsPerDay : 6) });
  var minsPerInp = el("input", { type: "number", min: "0", step: "1", value: String(job && job.minutesPerUnit !== undefined ? job.minutesPerUnit : 45) });
  var blockInp = el("input", { type: "number", min: "0", step: "5", value: String(job && job.minutes !== undefined ? job.minutes : 240) });
  var unitRow = el("div", { class: "row", style: "margin-bottom:10px" }, [
    el("div", { class: "field" }, [el("label", { text: "Units / day" }), unitsInp]),
    el("div", { class: "field" }, [el("label", { text: "Minutes / unit" }), minsPerInp])
  ]);
  var blockRow = el("div", { class: "field", style: "margin-bottom:10px" }, [el("label", { text: "Minutes / day" }), blockInp]);
  function syncMode() {
    unitRow.style.display = selMode.value === "unit" ? "" : "none";
    blockRow.style.display = selMode.value === "block" ? "" : "none";
  }
  selMode.addEventListener("change", syncMode);
  var selSh = el("select");
  selSh.appendChild(el("option", { value: "", text: "(no shift yet)" }));
  state.shifts.forEach(function (s2) {
    var o = el("option", { value: s2.id, text: s2.name });
    if (job && job.shiftId === s2.id) o.selected = true;
    selSh.appendChild(o);
  });
  selType.addEventListener("change", function () {
    // helpful defaults per type
    if (!job && !nameInp.value.trim()) nameInp.value = jobTypeLabel(selType.value);
    if (selType.value === "discharge") { selMode.value = "unit"; unitsInp.value = "6"; minsPerInp.value = "45"; }
    if (selType.value === "trashlinen" || selType.value === "porter") { selMode.value = "block"; blockInp.value = "240"; }
    syncMode();
  });
  var body = [
    el("div", { class: "field", style: "margin-bottom:10px" }, [el("label", { text: "Job name" }), nameInp]),
    el("div", { class: "field", style: "margin-bottom:10px" }, [el("label", { text: "Type" }), selType]),
    el("div", { class: "field", style: "margin-bottom:10px" }, [el("label", { text: "Workload model" }), selMode]),
    unitRow, blockRow,
    el("div", { class: "field" }, [el("label", { text: "Shift" }), selSh]),
    el("p", { class: "note", style: "margin-top:10px", text: "Non-space jobs count against employee capacity exactly like room work. Drag the job chip onto an employee on the board." })
  ];
  var buttons = [
    { label: job ? "Save" : "Add job", primary: true, onClick: function () {
      if (!nameInp.value.trim()) { toast("Job name is required", true); return; }
      var data = {
        name: nameInp.value.trim(), type: selType.value, mode: selMode.value,
        minutes: Number(blockInp.value) || 0,
        unitsPerDay: Number(unitsInp.value) || 0,
        minutesPerUnit: Number(minsPerInp.value) || 0,
        shiftId: selSh.value || null
      };
      if (job) Object.assign(job, data);
      else state.jobs.push(Object.assign({ id: uid("job"), employeeId: null }, data));
      save(); closeModal(); renderAll();
    } },
    { label: "Cancel", onClick: closeModal }
  ];
  if (job) {
    buttons.splice(1, 0, { label: "Delete", danger: true, onClick: function () {
      state.jobs = state.jobs.filter(function (x) { return x.id !== job.id; });
      save(); closeModal(); renderAll();
    } });
  }
  openModal(job ? "Edit non-space job" : "New non-space job", body, buttons);
  syncMode();
}

/* ================================================================
   views — settings
================================================================ */
function renderSettingsView() {

  host.appendChild(el("p", { class: "pagesub", text: "Rates, shifts and data management. All rates are editable estimates — tune them to your building." }));

  var prodInp = el("input", { type: "number", min: "60", step: "5", value: String(state.rates.productiveMinutes) });
  prodInp.addEventListener("change", function () { state.rates.productiveMinutes = Number(prodInp.value) || 420; save(); renderKPIs(); });
  fixRow.appendChild(el("div", { class: "field" }, [el("label", { text: "Productive minutes per shift (FTE base)" }), prodInp]));

    el("span", { class: "sub", text: "multipliers apply to a room's per-visit minutes; project rates are min / 1,000 ft²" })
  ]));
  var mbody = el("div", { class: "cbody" });
  var mtbl = el("table", { class: "grid" });

    el("th", { text: "Modifier" }), el("th", { text: "Kind" }), el("th", { class: "num", text: "Value" })

    var rm = el("button", { class: "btn small danger", text: "✕" });
    rm.addEventListener("click", function () {
      var used = state.employees.some(function (e2) { return e2.shiftId === sh.id; }) ||
                 state.rooms.some(function (r) { return r.shiftId === sh.id; });
      if (used) { toast("Shift is in use — move employees/rooms off it first", true); return; }
      state.shifts = state.shifts.filter(function (x) { return x.id !== sh.id; });
      save(); renderSettingsView();
    });
    tr.appendChild(el("td", {}, [rm]));
    stb.appendChild(tr);
  });
  stbl.appendChild(stb);
  sbody.appendChild(el("div", { class: "tablewrap" }, [stbl]));
  var addSh = el("button", { class: "btn small", text: "+ Add shift", style: "margin-top:10px" });
  addSh.addEventListener("click", function () {

    el("span", { class: "sub", text: "used by intake to auto-fill floor type, fixtures, tasks, frequency" })
  ]));
  var tcb = el("div", { class: "cbody" });
  var ttbl = el("table", { class: "grid" });
  ttbl.appendChild(el("thead", {}, [el("tr", {}, [
    el("th", { text: "Type" }), el("th", { text: "Floor type" }), el("th", { class: "num", text: "Fixtures" }),
    el("th", { text: "Frequency" }), el("th", { text: "Default tasks" })
  ])]));

    });

    tr.appendChild(el("td", {}, [ftSel]));
    var fxInp = el("input", { type: "number", min: "0", step: "1", value: String(rt.fixtures) });
    fxInp.addEventListener("change", function () { rt.fixtures = Number(fxInp.value) || 0; save(); });
    tr.appendChild(el("td", { class: "num" }, [fxInp]));

    state.frequencies.forEach(function (f2) {

  ]));

    var reader = new FileReader();
    reader.onload = function () {
      try {
        var incoming = JSON.parse(reader.result);
        if (!incoming || typeof incoming !== "object" || !incoming.version) throw new Error("not an OpsMatrix backup");
        openModal("Restore backup?", [el("p", { text: "This replaces ALL current scheduler data with the backup (" + (incoming.rooms ? incoming.rooms.length : 0) + " rooms). Your current data will be overwritten." })], [

        ]);

      { label: "Cancel", onClick: closeModal }
    ]);
  } }));
  bc.appendChild(bcb);

/* ================================================================
   print — daily schedule per employee
================================================================ */
function printSchedules() {
  var host = $("#printsheet");
  host.innerHTML = "";
  if (!state.employees.length) { toast("No employees to print", true); return; }
  state.employees.forEach(function (emp) {
    var sh = byId(state.shifts, emp.shiftId);
    var rooms = state.rooms.filter(function (r) { return r.employeeId === emp.id; })
      .sort(function (a, b) {
        var fa = byId(state.floors, a.floorId), fb = byId(state.floors, b.floorId);
        var ka = (fa ? fa.name : "") + deptKey(a) + a.name;
        var kb = (fb ? fb.name : "") + deptKey(b) + b.name;
        return ka.localeCompare(kb);
      });
    var jobs = state.jobs.filter(function (j) { return j.employeeId === emp.id; });
    var sheet = el("div", { class: "psheet" });
    sheet.appendChild(el("h2", { text: emp.name + " — Daily Schedule" }));
    sheet.appendChild(el("div", { class: "meta", text: todayStr() + " · " + (sh ? sh.name + " " + sh.start + "–" + sh.end : "no shift") + " · " + (emp.role || "EVS Tech") }));
    var tbl = el("table");
    tbl.appendChild(el("thead", {}, [el("tr", {}, [
      el("th", { text: "✓" }), el("th", { text: "Location" }), el("th", { text: "Room / job" }),
      el("th", { text: "Tasks" }), el("th", { text: "Min" })
    ])]));
    var tb = el("tbody");
    var total = 0;
    rooms.forEach(function (r) {
      var fl = byId(state.floors, r.floorId);
      var mins = roomDailyMinutes(r);
      total += mins;
      tb.appendChild(el("tr", {}, [
        el("td", { text: "☐", style: "width:26px;text-align:center" }),
        el("td", { text: (fl ? fl.name : "") + " / " + deptKey(r) }),
        el("td", { text: r.name + "  (" + r.roomType + ")" }),
        el("td", { text: (r.tasks || []).join(", ") }),
        el("td", { class: "num", text: fmt(mins, 0) })
      ]));
    });
    jobs.forEach(function (j) {
      var mins = jobDailyMinutes(j);
      total += mins;
      tb.appendChild(el("tr", {}, [
        el("td", { text: "☐", style: "width:26px;text-align:center" }),
        el("td", { text: "—" }),
        el("td", { text: j.name }),
        el("td", { text: jobTypeLabel(j.type) + (j.mode === "unit" ? " — " + j.unitsPerDay + " × " + j.minutesPerUnit + " min" : "") }),
        el("td", { class: "num", text: fmt(mins, 0) })
      ]));
    });
    if (!rooms.length && !jobs.length) {
      tb.appendChild(el("tr", {}, [el("td", { colspan: "5", text: "Nothing assigned." })]));
    }
    tbl.appendChild(tb);
    tbl.appendChild(el("tfoot", {}, [el("tr", {}, [
      el("td", { colspan: "4", text: "Total assigned", style: "font-weight:700" }),
      el("td", { class: "num", text: fmt(total, 0) + " / " + state.rates.productiveMinutes, style: "font-weight:700" })
    ])]));
    sheet.appendChild(tbl);
    sheet.appendChild(el("div", { class: "sig" }, [
      el("span", { text: "Employee signature" }),
      el("span", { text: "Supervisor" })
    ]));
    host.appendChild(sheet);
  });
  window.print();
}

/* ================================================================
   navigation + init
================================================================ */
function switchView(v) {
  state.ui.view = v;
  save();
  renderAll();
}
function renderContent() {
  closeDrawer();
  var v = state.ui.view;
  if (v === "import") renderImportView();
  else if (v === "map") renderMapView();
  else if (v === "settings") renderSettingsView();
  else renderScheduleView();
  $$("#mainTabs button").forEach(function (b) {
    b.className = b.getAttribute("data-view") === v ? "active" : "";
  });
}
function renderAll() {
  renderKPIs();
  renderTree();
  renderContent();
}

$$("#mainTabs button").forEach(function (b) {
  b.addEventListener("click", function () { switchView(b.getAttribute("data-view")); });
});
$("#btnDrawerClose").addEventListener("click", closeDrawer);
$("#btnClearScope").addEventListener("click", function () { setScope(null); });
$("#btnTreeToggle").addEventListener("click", function () { $("#treePane").classList.toggle("open"); });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { closeModal(); closeDrawer(); }
});
window.addEventListener("resize", function () {
  if (state.ui.view === "map") renderContent();
});

// first run: no data → land on import
if (!state.rooms.length && !state.buildings.length) state.ui.view = "import";
renderAll();

})();
