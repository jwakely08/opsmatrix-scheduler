function parseCSVLine(line) {
  var res = [],
    cur = '',
    inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (c === '"') {
      if (inQ && line[i + 1] === '"') {
        cur += '"';
        i++;
      } else {
        inQ = !inQ;
      }
    } else if (c === ',' && !inQ) {
      res.push(cur.trim());
      cur = '';
    } else {
      cur += c;
    }
  }
  res.push(cur.trim());
  return res;
}

  var lines = text.split('\n');

    var line = lines[i];
    if (!line.trim()) continue;
    rawRows.push(parseCSVLine(line));
  }

}

function scoreRowAsHeader(row) {

    return String(c).length > 40;
  })) return 0;
  var matchedFields = {};

  row.forEach(function (cell) {

    var hit = HEADER_KWDS[nk];

  if (mc === 0) return 0;
  var score = totalW * 5;
  if (mc >= 3) score += 15;
  if (mc >= 5) score += 15;
  if (matchedFields['roomNumber']) score += 12;
  if (matchedFields['roomType']) score += 12;
  if (matchedFields['squareFeet']) score += 10;

}

        if (cyp < miny) miny = cyp; if (cyp > maxy) maxy = cyp;
        if (cxp > 0 && label[cyp * w + cxp - 1] === 0) { label[cyp * w + cxp - 1] = nextId; qx[tail] = cxp - 1; qy[tail] = cyp; tail++; }
        if (cxp < w - 1 && label[cyp * w + cxp + 1] === 0) { label[cyp * w + cxp + 1] = nextId; qx[tail] = cxp + 1; qy[tail] = cyp; tail++; }
        if (cyp > 0 && label[(cyp - 1) * w + cxp] === 0) { label[(cyp - 1) * w + cxp] = nextId; qx[tail] = cxp; qy[tail] = cyp - 1; tail++; }
        if (cyp < hh - 1 && label[(cyp + 1) * w + cxp] === 0) { label[(cyp + 1) * w + cxp] = nextId; qx[tail] = cxp; qy[tail] = cyp + 1; tail++; }
      }
      regions.push({ id: nextId, area: area, touchesBorder: touchesBorder, minx: minx, maxx: maxx, miny: miny, maxy: maxy });

    }
  }

  regions.forEach(function (rg) {
    if (rg.touchesBorder) return;
    if (rg.area < total * 0.0015 || rg.area > total * 0.35) return;
    var poly = fpTraceRegion(label, rg, w, hh);
    if (!poly || poly.length < 4) return;
    poly = fpRDP(poly, Math.max(2, w * 0.006));
    if (poly.length < 3 || poly.length > 60) return;
    poly = fpRectify(poly);
    poly = fpExpand(poly, iter);
    out.push(poly.map(function (p) { return { x: p.x / sc, y: p.y / sc }; }));
  });
  return out;
}

function fpLoadPlans() {

    var r = localStorage.getItem('opsmatrix_v7_plans');
    if (r) return JSON.parse(r);
  } catch (e) {}
  return [];
}
function fpSavePlans(plans) {

    localStorage.setItem('opsmatrix_v7_plans', JSON.stringify(plans));
    try { window.dispatchEvent(new CustomEvent('opsmatrix:floorplans')); } catch (e2) {}
    return true;
  } catch (e) {

    try { window.dispatchEvent(new CustomEvent('opsmatrix:floorplans')); } catch (e3) {}
    return false;
  }
}
function fpClonePts(pts) {
  return (pts || []).map(function (p) {
    return { x: Number(p.x) || 0, y: Number(p.y) || 0 };
  });
}
function fpVisualMeta(plan, pts) {
  return {
    floorPlanId: plan.id,
    visualPlanId: plan.id,
    visualBuilding: plan.building,
    visualFloor: plan.floor,
    visualW: plan.w,
    visualH: plan.h,
    visualPts: fpClonePts(pts),
    visualUpdatedAt: new Date().toISOString()
  };
}
function fpApplyVisual(sp, plan, pts) {
  return Object.assign({}, sp, fpVisualMeta(plan, pts));
}
function fpSchedulePlanKey(building, floor) {
  return (String(building || 'Unassigned Building') + '||' + String(floor || 'Unassigned Floor')).toLowerCase();
}
function fpEnsureSchedulePlan(map, order, id, building, floor, w, h, img, synthetic) {
  id = id || ('visual-' + fpSchedulePlanKey(building, floor).replace(/[^a-z0-9]+/g, '-'));
  if (!map[id]) {
    map[id] = {
      id: id,
      building: building || 'Unassigned Building',
      floor: floor || 'Unassigned Floor',
      img: img || '',
      w: Math.max(320, Number(w) || 960),
      h: Math.max(240, Number(h) || 620),
      rooms: [],
      synthetic: !!synthetic
    };
    order.push(map[id]);
  } else {
    if (!map[id].img && img) map[id].img = img;
    if (w && (!map[id].w || map[id].w < w)) map[id].w = w;
    if (h && (!map[id].h || map[id].h < h)) map[id].h = h;
    map[id].synthetic = map[id].synthetic && !!synthetic;
  }
  return map[id];
}
function fpBuildSchedulePlans(spaces, rawPlans) {
  var byId = {}, planMap = {}, order = [], represented = {};
  (spaces || []).forEach(function (sp) { byId[sp.id] = sp; });
  (rawPlans || []).forEach(function (rp) {
    var p = fpEnsureSchedulePlan(planMap, order, rp.id, rp.building, rp.floor, rp.w, rp.h, rp.img, false);
    (rp.rooms || []).forEach(function (r) {
      var sp = byId[r.spaceId];
      if (!sp) return;
      var pts = fpClonePts(sp.visualPlanId === rp.id && sp.visualPts && sp.visualPts.length >= 3 ? sp.visualPts : r.pts);
      if (pts.length < 3) return;
      p.rooms.push({ spaceId: sp.id, pts: pts });
      represented[sp.id] = true;
    });
  });
  (spaces || []).forEach(function (sp) {
    var pts = fpClonePts(sp.visualPts);
    if (pts.length < 3 || represented[sp.id]) return;
    var pid = sp.visualPlanId || sp.floorPlanId || ('visual-' + fpSchedulePlanKey(sp.building, sp.floor).replace(/[^a-z0-9]+/g, '-'));
    var p = fpEnsureSchedulePlan(planMap, order, pid, sp.visualBuilding || sp.building, sp.visualFloor || sp.floor, sp.visualW, sp.visualH, '', true);
    p.rooms.push({ spaceId: sp.id, pts: pts });
    represented[sp.id] = true;
  });
  var groups = {}, groupOrder = [];
  (spaces || []).forEach(function (sp) {
    if (represented[sp.id]) return;
    if (!sp.roomNumber && !sp.roomName) return;
    var key = fpSchedulePlanKey(sp.building, sp.floor);
    if (!groups[key]) { groups[key] = []; groupOrder.push(key); }
    groups[key].push(sp);
  });
  groupOrder.forEach(function (key) {
    var list = groups[key].slice().sort(function (a, b) {
      return String(a.roomNumber || a.roomName || '').localeCompare(String(b.roomNumber || b.roomName || ''), undefined, { numeric: true });
    });
    if (!list.length) return;
    var b = list[0].building || 'Unassigned Building';
    var f = list[0].floor || 'Unassigned Floor';
    var cols = Math.max(2, Math.ceil(Math.sqrt(list.length * 1.55)));
    var cellW = 132, cellH = 82, gap = 12, pad = 22;
    var rows = Math.ceil(list.length / cols);
    var existingFloorPlan = order.find(function (p0) {
      return fpSchedulePlanKey(p0.building, p0.floor) === key;
    });
    var p = existingFloorPlan || fpEnsureSchedulePlan(planMap, order, 'grid-' + key.replace(/[^a-z0-9]+/g, '-'), b, f, pad * 2 + cols * cellW + (cols - 1) * gap, pad * 2 + rows * cellH + (rows - 1) * gap, '', true);
    var baseY = existingFloorPlan ? (p.h || 0) + gap : pad;
    p.w = Math.max(p.w || 0, pad * 2 + cols * cellW + (cols - 1) * gap);
    p.h = Math.max(p.h || 0, baseY + rows * cellH + (rows - 1) * gap + pad);
    p.synthetic = true;
    list.forEach(function (sp, idx) {
      var c = idx % cols, r = Math.floor(idx / cols);
      var x = pad + c * (cellW + gap), y = baseY + r * (cellH + gap);
      p.rooms.push({ spaceId: sp.id, pts: [{ x: x, y: y }, { x: x + cellW, y: y }, { x: x + cellW, y: y + cellH }, { x: x, y: y + cellH }] });
      represented[sp.id] = true;
    });
  });
  return order.filter(function (p) { return (p.rooms || []).length > 0; });
}
